[project]
name = "attention-tracker"
version = "0.1.0"
description = "Attention Economy Tracker — behavioral analytics for smartphone app usage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# mock_backend/ (M4 demo layer). Required to run `uvicorn mock_backend.main:app`
# or to run tests/mock_backend/ — httpx is TestClient's transport, not used
# directly, but FastAPI's TestClient requires it to be installed.
backend = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
]
# models/ (M5 — LightGBM distillation). lightgbm-dependent tests skip
# gracefully (not fail) when this isn't installed.
ml = [
    "numpy>=1.26,<3.0",
    "lightgbm>=4.0,<5.0",
]
# Everything needed to run the full test suite, including tests/mock_backend/.
test = [
    "attention-tracker[dev,backend,ml]",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]