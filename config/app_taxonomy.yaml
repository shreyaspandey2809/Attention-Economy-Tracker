# Seed app taxonomy — package_name -> {display_name, category}
# ~50 apps spanning all AppCategory values. This is the ground-truth
# mapping the synthetic archetypes (M2) will draw from, and the
# default lookup the feature pipeline (M3) falls back to before any
# user override exists.
#
# Categories: PRODUCTIVE, ADDICTIVE, ENTERTAINMENT, COMMUNICATION,
#             UTILITY, UNKNOWN

